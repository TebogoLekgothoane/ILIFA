kind = "mobile"
previewPath = "/"
title = "Ilifa"
description = "A mobile heritage experience that lets visitors stand at real historical places, choose a time period, see an AR-style reconstruction, hear the story, and explore curated trails."
version = "1.0.0"
id = "artifacts/ilifa"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20663

[services.development]
run = "pnpm --filter @workspace/Ilifa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ilifa", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ilifa", "run", "serve" ]

[services.env]
PORT = "20663"
BASE_PATH = "/"
